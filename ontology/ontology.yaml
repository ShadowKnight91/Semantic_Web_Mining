    closed: true
    values:
      otp:
        descriptor: "one-time password or verification code"
        synonyms: [otp, one time password, one time code, verification code, security code, confirmation code,
                   authentication code, 2fa code, two factor code, code, six digit code, passcode sent]
      ssn:
