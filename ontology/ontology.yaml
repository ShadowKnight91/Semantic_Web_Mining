      "Google": [google]
      "PayPal": [paypal]
      "Walmart": [walmart]
      "Target": [target]
      "Best Buy": [best buy, geek squad]
      "eBay": [ebay]
      "Netflix": [netflix]
      "Bank of America": [bank of america, bofa]
      "Chase": [chase, chase bank, jpmorgan chase, jp morgan chase]
      "Wells Fargo": [wells fargo]
      "Citibank": [citibank, citi bank, citi]
      "Capital One": [capital one]
      "Visa": [visa]
      "Mastercard": [mastercard, master card]
      "American Express": [american express, amex]
      "Western Union": [western union]
      "MoneyGram": [moneygram, money gram]
      "Coinbase": [coinbase]
      "Norton": [norton, norton antivirus, nortonlifelock]
      "McAfee": [mcafee]
      "Comcast": [comcast, xfinity]
      "Verizon": [verizon]
      "AT&T": ["at&t", att, at and t]
      "T-Mobile": [t mobile, tmobile]
      "Publishers Clearing House": [publishers clearing house, pch]
      "CVS": [cvs, cvs pharmacy]
      "Walgreens": [walgreens]
      "State Farm": [state farm]
      "Geico": [geico]

  PressureTactic:
    descriptor: "Persuasion used: urgency, threat, reward, fear, secrecy"
    closed: true
    values:
      urgency:
        descriptor: "time pressure: act now, today, immediately, a deadline"
        synonyms: [urgency, urgent, immediately, right now, right away, today, time sensitive, time pressure,
                   deadline, limited time, limited time offer, act now, hurry, as soon as possible, asap,
                   within 24 hours, expires, last chance, quickly, before the end of the day]
      threat:
        descriptor: "threat of arrest, legal action, suspension, fines, disconnection or account freezing"
        synonyms: [threat, threaten, arrest, arrested, warrant, arrest warrant, lawsuit, legal action, jail,
                   prison, suspend, suspended, suspension, fine, penalty, deport, deportation, freeze, frozen,
                   blocked, cut off, disconnect, disconnected, disconnection, shut off, charges, prosecution,
                   seize, seizure, legal consequences, account closure]
      reward:
        descriptor: "promise of a prize, refund, free gift, discount or guaranteed return"
        synonyms: [reward, prize, won, winner, win, free, free gift, gift, bonus, refund, cash back, discount,
                   jackpot, sweepstakes, lottery, compensation, reimbursement, guaranteed return,
                   investment opportunity, special offer, promotion, lower interest rate]
      fear:
        descriptor: "creating fear: hacked device, stolen identity, suspicious activity, emergency, accident"
        synonyms: [fear, scare, danger, dangerous, compromised, hacked, virus, malware, stolen, identity theft,
