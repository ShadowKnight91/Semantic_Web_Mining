      zelle:
        descriptor: "Zelle"
        synonyms: [zelle]
      p2p_app:
        descriptor: "peer-to-peer payment app (Venmo, Cash App, PayPal)"
        synonyms: [venmo, cash app, cashapp, paypal, apple pay, google pay, payment app]
      bank_transfer:
