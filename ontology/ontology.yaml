        descriptor: "payment by credit / debit card over the phone or online"
        synonyms: [credit card payment, pay by card, card payment, debit card payment, pay over the phone,
                   pay online]
      other:
        descriptor: "any other payment method"
        synonyms: []

  CallbackNumber:
    descriptor: "Phone number or extension the caller gives"
    closed: false

relations:
  CLAIMS_TO_BE:
    source: Call
    target: ClaimedIdentity
    rdf_property: claimsToBe
    descriptor: "the caller presents themself as this identity"
  MENTIONS_ORG:
    source: Call
    target: Organization
    rdf_property: mentionsOrg
    descriptor: "the caller names this company or agency"
  USES_TACTIC:
    source: Call
    target: PressureTactic
    rdf_property: usesTactic
    descriptor: "the caller uses this persuasion / pressure technique"
  REQUESTS:
    source: Call
    target: RequestedAsset
    rdf_property: requests
    descriptor: "the caller asks the receiver for this asset or information"
  PAY_VIA:
    source: Call
    target: PaymentChannel
    rdf_property: payVia
    descriptor: "the caller wants money to move through this channel"
  PROVIDES_NUMBER:
    source: Call
    target: CallbackNumber
    rdf_property: providesNumber
    descriptor: "the caller gives this call-back number, extension or IVR option"
