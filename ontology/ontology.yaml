# Minimal fraud-call ontology (proposal Table II).
#
# Single source of truth for the pipeline:
#   * LLM extraction prompts (type descriptors + allowed values)
#   * JSON / schema validation of extracted triples
#   * entity standardization (synonyms, organization aliases)
#   * Neo4j node labels / relationship types
#   * RDF export (the OWL T-box lives in fraud_call_ontology.ttl and must stay in sync;
#     tests/test_ontology.py checks this)
#
# Closed types have a controlled vocabulary ("values"); the LLM must pick one of them.
# Open types (Organization, CallbackNumber) keep the name / number from the call and are
# canonicalized with "aliases" or number normalization.
name: FraudCallOntology
version: "0.1.0"
namespace: "http://www.semanticweb.org/cse573/scamkg#"

entity_types:
  Call:
    descriptor: "One transcript; holds label and metadata"
    extractable: false

  ClaimedIdentity:
    descriptor: "Who the caller says they are (bank, IRS, police, tech support, relative)"
    closed: true
    values:
      bank:
        descriptor: "a bank, credit union, card issuer or its fraud department"
        synonyms: [bank, bank representative, bank employee, bank officer, credit union, fraud department,
                   fraud prevention department, fraud team, card services, cardmember services, card issuer,
                   credit card company, bank security team, account security team, financial institution, banker]
      government_agent:
        descriptor: "a government agency or official (SSA, IRS, Medicare, customs, immigration)"
        synonyms: [government, government agent, government official, government agency, federal agent,
                   federal agency, federal government, government employee, social security,
                   social security administration, social security officer, social security agent,
                   ssa agent, ssa officer, irs agent, irs officer, tax agent, tax officer, internal revenue service,
                   irs, ssa, medicare, medicare representative, customs officer, immigration officer, treasury,
                   treasury department, dmv, census bureau]
      law_enforcement:
        descriptor: "police, sheriff, FBI, DEA, marshals, courts"
        synonyms: [police, police officer, officer, sheriff, deputy, detective, fbi agent, fbi, dea agent, dea,
