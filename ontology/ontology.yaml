        synonyms: [ssn, social security number, social security, social insurance number, national id number,
                   tax id, taxpayer id]
      card_number:
        descriptor: "credit / debit card number, CVV or expiry"
        synonyms: [card number, credit card number, debit card number, card details, credit card, debit card,
                   card information, cvv, expiration date, card, card info, card details and cvv]
      bank_account:
        descriptor: "bank account / routing number or online banking access"
        synonyms: [bank account, account number, routing number, bank details, banking information,
                   account details, online banking login, bank login, bank account number]
      password:
        descriptor: "password, PIN or login credentials"
        synonyms: [password, pin, pin number, login credentials, username and password, account password,
                   credentials, login]
      remote_access:
