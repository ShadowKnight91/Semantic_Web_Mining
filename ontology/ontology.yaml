        synonyms: [employer, recruiter, hiring manager, hr, human resources, job agency, staffing agency,
                   employment agency, headhunter, talent acquisition, manager, boss]
      prize_or_lottery:
        descriptor: "a lottery, sweepstakes, contest or prize organizer"
        synonyms: [lottery, sweepstakes, prize department, contest, lottery official, prize, prize patrol,
                   giveaway, raffle, lottery commission, publishers clearing house]
      insurance:
        descriptor: "an insurance or warranty provider"
        synonyms: [insurance, insurance agent, insurance company, insurance provider, warranty company,
                   auto warranty, vehicle warranty, extended warranty, car warranty, health insurance]
      healthcare_provider:
        descriptor: "a doctor's office, clinic, hospital, pharmacy or dentist"
        synonyms: [doctor, "doctor's office", clinic, hospital, pharmacy, pharmacist, nurse, dentist,
                   dental office, medical office, healthcare provider, physician, medical center, health clinic,
                   receptionist]
      retailer_customer_service:
