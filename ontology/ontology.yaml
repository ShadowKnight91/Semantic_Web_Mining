                   promotions department, vacation club, timeshare, travel agency, solar company, real estate agent,
                   investment advisor, broker, financial advisor, survey, market research]
      other:
        descriptor: "any other identity"
        synonyms: []

  Organization:
    descriptor: "Named company or agency mentioned (Amazon, SSA, Microsoft)"
    closed: false
    aliases:
      "Social Security Administration": [ssa, social security administration, social security office,
