                   investigator, special agent]
      tech_support:
        descriptor: "technical / computer support (Microsoft, Apple, antivirus, IT help desk)"
        synonyms: [tech support, technical support, it support, computer support, microsoft support,
                   apple support, windows support, windows technician, help desk, technician, computer technician,
                   security technician, antivirus support, geek squad, support agent, microsoft technician]
      relative_or_friend:
        descriptor: "a family member, friend or acquaintance of the receiver"
        synonyms: [relative, family member, grandson, granddaughter, grandchild, son, daughter, nephew, niece,
                   cousin, brother, sister, mom, mother, dad, father, uncle, aunt, friend, old friend, family,
                   grandma, grandpa, grandmother, grandfather, spouse, husband, wife, neighbor]
      utility_company:
        descriptor: "an electricity, gas, water or other utility provider"
        synonyms: [utility company, utility, electric company, power company, gas company, water company,
                   energy company, electricity provider, utility provider, power and light]
      delivery_service:
