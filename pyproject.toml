[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scamkg"
version = "0.1.0"
description = "From call transcripts to knowledge graphs: LLM-powered phone scam detection (CSE 573, Project P10)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "networkx>=3.1",
    "rdflib>=7.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["datasets>=2.18"]
neo4j = ["neo4j>=5.14"]
dashboard = ["streamlit>=1.50"]
deep = ["torch>=2.1", "transformers>=4.40", "sentence-transformers>=2.7", "torch_geometric>=2.5"]
dev = ["pytest>=7.4"]

[project.scripts]
scamkg = "scamkg.cli:main"

[tool.setuptools.packages.find]
include = ["scamkg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
